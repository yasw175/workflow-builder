actions:
  - name: triggerWorkflowRun
    definition:
      kind: synchronous
      handler: https://workflow-builder-umber-beta.vercel.app/api/triggerWorkflowRun
      forward_client_headers: true
      timeout: 60
    permissions:
      - role: user
  - name: approveStep
    definition:
      kind: synchronous
      handler: https://workflow-builder-umber-beta.vercel.app/api/approveStep
      forward_client_headers: true
      timeout: 60
    permissions:
      - role: user
custom_types:
  enums: []
  input_objects: []
  objects:
    - name: TriggerWorkflowRunOutput
    - name: ApproveStepOutput
  scalars: []
